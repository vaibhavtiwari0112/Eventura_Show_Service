server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: eventura-show

  # Redis (Seat Locking)
  data:
    redis:
      url: ${REDIS_URL:redis://default:EFw4lxHrGHaipf9H96w4DO37LKNtCSiT@redis-15991.c264.ap-south-1-1.ec2.redns.redis-cloud.com:15991}

  # Database (Postgres)
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/neondb}
    username: ${JDBC_DATABASE_USERNAME:neondb_owner}
    password: ${JDBC_DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update   # ✅ For dev; in prod use validate or none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Internal service URLs
catalog:
  url: ${CATALOG_SERVICE_URL:http://localhost:8083}

booking:
  url: ${BOOKING_SERVICE_URL:http://localhost:8082}

# Event Topics
event:
  topics:
    show: ${SHOW_EVENTS_TOPIC:show.events}

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: '*'
